name: iOS release build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  build_ios:
    runs-on: macos-26
    environment: production
    env:
      IPA_PATH: build/ios/ipa/thunder-v${{ inputs.version }}.ipa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Flutter from submodule
        uses: ./.github/actions/setup-flutter

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Precache iOS Flutter engine
        run: flutter precache --ios

      - name: Install iOS pods
        working-directory: ios
        run: pod install

      - name: Prepare iOS Swift package cache
        run: |
          rm -rf "$RUNNER_TEMP/swiftpm"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm/artifacts"
          mkdir -p "$RUNNER_TEMP/swiftpm/source" "$RUNNER_TEMP/swiftpm/cache"

      - name: Resolve iOS Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace ios/Runner.xcworkspace \
            -scheme production \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/swiftpm/source" \
            -packageCachePath "$RUNNER_TEMP/swiftpm/cache" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates

      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          for secret_name in APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [[ -z "${!secret_name}" ]]; then
              echo "$secret_name is not set"
              exit 1
            fi
          done
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          if ! printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$key_path" 2>/dev/null; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$key_path"
          fi
          chmod 600 "$key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Archive iOS app
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme production \
            -configuration Release-production \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Thunder.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/swiftpm/source" \
            -packageCachePath "$RUNNER_TEMP/swiftpm/cache" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackageUpdates \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM=L7P596HY6P \
            CODE_SIGN_STYLE=Automatic

      - name: Export iOS IPA
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Thunder.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist ios/ExportOptions.release.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$APP_STORE_CONNECT_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
          mkdir -p "$(dirname "$IPA_PATH")"
          ipa_path=$(find "$RUNNER_TEMP/ios-export" -maxdepth 1 -name "*.ipa" -print -quit)
          if [[ -z "$ipa_path" ]]; then
            echo "No IPA was exported to $RUNNER_TEMP/ios-export"
            exit 1
          fi
          mv "$ipa_path" "$IPA_PATH"

      - name: Verify iOS IPA
        run: |
          unzip -l "$IPA_PATH" | grep 'Payload/Runner.app'

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
