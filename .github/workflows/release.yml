name: release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: Is this a dry run (do not generate draft release)?
        default: true

permissions:
  contents: read

jobs:
  release_info:
    uses: ./.github/workflows/release-info.yml
    with:
      dry_run: ${{ inputs.dry_run == true }}

  build_android:
    needs: release_info
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ needs.release_info.outputs.version }}
    secrets: inherit

  build_ios:
    needs: release_info
    uses: ./.github/workflows/release-ios.yml
    with:
      version: ${{ needs.release_info.outputs.version }}
    secrets: inherit

  publish_release:
    needs:
      - release_info
      - build_android
      - build_ios
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Create draft release and upload artifacts
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ needs.release_info.outputs.version }}"
          prerelease: ${{ needs.release_info.outputs.prerelease }}
          draft: true
          artifacts: release-artifacts/thunder-v${{ needs.release_info.outputs.version }}-*.apk,release-artifacts/thunder-v${{ needs.release_info.outputs.version }}.ipa
          generateReleaseNotes: true
