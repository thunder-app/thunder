name: ci

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-flutter

      - name: Check that the release versions agree
        run: python3 scripts/prepare-release.py --check

      - name: Check that translations are sorted
        run: |
          dart pub global activate arb_utils
          # Use the installed executable; `dart pub global run` rejects Flutter packages.
          "${PUB_CACHE:-$HOME/.pub-cache}/bin/arb_utils" sort lib/l10n/app_en.arb
          git diff --exit-code lib/l10n/app_en.arb

      - name: Check formatting, skipping generated files
        run: |
          git ls-files 'lib/*.dart' ':!:*.g.dart' ':!:*.steps.dart' ':!:*.freezed.dart' ':!:lib/l10n/generated/*' \
            | xargs dart format -o none --set-exit-if-changed

      - name: Analyze
        # Only errors fail the build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test
