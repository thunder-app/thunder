name: instances

on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  instances:
    name: Instances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the known instances
        run: python3 scripts/update-instances.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Update instances
          title: Update instances
          body: This PR updates `known_instances.dart`, `AndroidManifest.xml`, `manifest.json` and `content.js` with the latest Lemmy instances from Lemmyverse and PieFed instances from FediDB.
          branch: update-instances
          delete-branch: true
          author: GitHub <noreply@github.com>
