name: Android release build

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  build_android:
    runs-on: ubuntu-24.04
    environment: production
    env:
      ANDROID_BUILD_TOOLS: '36.0.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK and signing tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;$ANDROID_BUILD_TOOLS"

      - name: Set up Flutter from submodule
        uses: ./.github/actions/setup-flutter

      - name: Build unsigned Android APKs
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter pub get --enforce-lockfile
          flutter build apk --no-pub --split-per-abi --release --flavor production

      - name: Sign Android APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          keystore=$(mktemp "$RUNNER_TEMP/apksign.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          build_tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS"
          apk_dir=build/app/outputs/flutter-apk
          for arch in arm64-v8a armeabi-v7a x86_64; do
            unsigned_apk="$apk_dir/app-$arch-production-release.apk"
            signed_apk="$apk_dir/thunder-v$VERSION-$arch.apk"
            "$build_tools/zipalign" -c -P 16 4 "$unsigned_apk"
            # Android 7+ supports v2 signatures. Preserve Gradle's ZIP layout for apksigcopier.
            "$build_tools/apksigner" sign --alignment-preserved true --v1-signing-enabled false \
              --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD --out "$signed_apk" "$unsigned_apk"
            "$build_tools/apksigner" verify "$signed_apk"
            sha256sum "$signed_apk"
          done

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apks
          path: ./build/app/outputs/flutter-apk/thunder-v${{ inputs.version }}-*.apk
          if-no-files-found: error
